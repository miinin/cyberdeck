# Pull requests: each PR gets a temporary preview URL on the TEST site,
# so production hosting never carries preview channels. The URL is posted as a PR comment.
name: Preview (pull request)
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:test
      - run: node scripts/check-dist-env.mjs test
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CYBERDECK_TCG_DEV }}
          projectId: cyberdeck-tcg-dev
          target: test
          # 3 days (T-089): at most 50 channels per site; 14 days filled the quota and failed every PR (HTTP 429).
          expires: 3d

# Test: every push/merge to the test branch deploys to the permanent test site.
name: Deploy test (test)
on:
  push:
    branches:
      - test
# Least privilege (SR-8). The deploy action only uses a GitHub token on pull requests,
# so live deploys get no repoToken and read-only repository access.
permissions:
  contents: read
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:test
      - run: node scripts/check-dist-env.mjs test
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CYBERDECK_TCG_DEV }}
          projectId: cyberdeck-tcg-dev
          target: test
          channelId: live
